plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '5.1.+'
}

group = property('mod_group')
version = property('mod_version')
archivesBaseName = property('mod_id')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net" }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.3.0"
    implementation fg.deobf("curse.maven:create-328085:6247663")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : "1.20.1",
            minecraft_version_range: "[1.20.1]",
            forge_version       : "47.3.0",
            forge_version_range : "[47,)",
            loader_version_range: "[47,)",
            mod_id              : project.property('mod_id'),
            mod_name            : "Create: Structures Overhaul",
            mod_license         : "MIT License",
            mod_version         : project.property('mod_version'),
            mod_authors         : "Denmoth",
            mod_description     : "Overhauls exploration by adding immersive, Create-themed structures to the world."
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar') {
    manifest {
        attributes([
                "Specification-Title"     : "Create Structures Overhaul",
                "Specification-Vendor"    : "Denmoth",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Denmoth",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

def loadPrismLocalProperties() {
    def p = new Properties()
    def f = rootProject.file('prism.local.properties')
    if (f.exists()) {
        f.withInputStream { p.load(new InputStreamReader(it, java.nio.charset.StandardCharsets.UTF_8)) }
    }
    p
}

def prismFindDev1201InstanceId = { File instancesRoot ->
    if (!instancesRoot.isDirectory()) return null
    String found = null
    instancesRoot.eachDir { File dir ->
        if (found != null) return
        def cfg = new File(dir, 'instance.cfg')
        def display = ''
        if (cfg.isFile()) {
            cfg.eachLine('UTF-8') { line ->
                if (line.startsWith('name=')) display = line.substring(5).trim()
            }
        }
        def hay = (display + ' ' + dir.name).toLowerCase(java.util.Locale.ROOT)
        if (hay.contains('dev') && hay.contains('1.20.1')) {
            found = dir.name
        }
    }
    found
}

def resolvePrism = {
    def local = loadPrismLocalProperties()
    def p = { String k -> local.getProperty(k) ?: project.findProperty(k)?.toString() }
    def isLinux = System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT).contains('linux')
    def isWin = System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT).contains('win')
    def instancesDir = p('prism_instances_path') ?: p('global_prism_instances_path')
    if (!instancesDir) {
        if (isLinux) {
            instancesDir = "${System.getProperty('user.home')}/.local/share/PrismLauncher/instances"
        } else if (isWin) {
            def ad = System.getenv('APPDATA')
            instancesDir = ad ? "${ad}/PrismLauncher/instances" : null
        }
    }
    if (!instancesDir) {
        throw new GradleException('Set prism_instances_path or global_prism_instances_path')
    }
    def instanceId = p('prism_instance_id') ?: p('prism_instance_name')
    if (!instanceId) {
        instanceId = prismFindDev1201InstanceId(file(instancesDir))
    }
    if (!instanceId) {
        throw new GradleException("No prism_instance_id and no dev+1.20.1 instance under ${instancesDir}")
    }
    def prismExe = p('prism_exe') ?: p('global_prism_exe')
    def useFlatpak = 'true'.equalsIgnoreCase(p('prism_flatpak'))
    if (isLinux && !prismExe && !useFlatpak) {
        prismExe = 'prismlauncher'
    }
    def targetModId = project.findProperty('mod_id')?.toString() ?: 'examplemod'
    def modsDir = file("${instancesDir}/${instanceId}/minecraft/mods")
    [
        instanceId    : instanceId,
        modsDir       : modsDir,
        prismExe      : prismExe,
        useFlatpak    : useFlatpak,
        isLinux       : isLinux,
        targetModId   : targetModId
    ]
}

tasks.register('copyJarToPrism') {
    dependsOn tasks.jar
    group = 'execution'
    doLast {
        def r = resolvePrism()
        if (!r.modsDir.exists()) {
            throw new GradleException("Mods dir missing: ${r.modsDir}")
        }
        fileTree(dir: r.modsDir, include: "${r.targetModId}-*.jar").each { delete it }
        copy { from tasks.jar.archiveFile; into r.modsDir }
    }
}

tasks.register('runInPrism', Exec) {
    dependsOn tasks.named('copyJarToPrism')
    group = 'execution'
    doFirst {
        def r = resolvePrism()
        if (!r.prismExe && !r.useFlatpak) {
            throw new GradleException('prism_exe / global_prism_exe or prism_flatpak=true')
        }
        if (r.isLinux && r.useFlatpak) {
            setCommandLine('flatpak', 'run', 'org.prismlauncher.PrismLauncher', '--launch', r.instanceId)
        } else {
            setCommandLine(r.prismExe, '--launch', r.instanceId)
        }
    }
}